[project]
name = "wazuh-daily-triage"
version = "0.7.0"
description = "AI-assisted daily triage for Wazuh SIEM"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rüstem Duru" }]
requires-python = ">=3.11"
keywords = ["wazuh", "siem", "security", "soc", "llm", "triage", "opensearch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/dururustem68/wazuh-daily-triage"
Issues = "https://github.com/dururustem68/wazuh-daily-triage/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["app/web", "app/privacy.py", "app/runtime.py", "app/authz.py", "app/formatting.py", "app/reporting.py", "app/services.py"]
ignore_missing_imports = true
follow_imports = "silent"      # gradual: legacy modules keep their types but their errors are not in scope
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
