# Wazuh Daily Triage — copy to config/environments.yaml and edit.
# ${VAR} and ${VAR:-default} are expanded from environment variables (.env), so keep secrets there.
#
# Single environment? You can skip this file entirely and use WAZUH_* variables in .env instead.

app:
  timezone: ${TZ:-UTC}          # schedule times and UI timestamps use this zone
  language: ${APP_LANGUAGE:-en} # en | tr | es | de — default UI and report language
  title: Wazuh Daily Triage

llm:
  # anthropic | openai (any OpenAI-compatible endpoint: OpenAI, Azure OpenAI, Ollama, vLLM, LM Studio, LiteLLM...) | mock
  provider: ${LLM_PROVIDER:-anthropic}
  model: ${LLM_MODEL}
  api_key: ${LLM_API_KEY}
  # openai provider: https://api.openai.com/v1 | http://ollama:11434/v1 | full Azure URL incl. ?api-version=
  base_url: ${LLM_BASE_URL:-}
  max_tokens: 4096
  temperature: 0.2              # remove for reasoning models that only accept the default
  # token_param: max_completion_tokens   # newer OpenAI models
  # extra_body: {}                       # extra fields passed to the provider verbatim
  max_tool_steps: 14            # tool-call budget per run (cost ceiling)

notify:                         # critical alerts only — see docs/notifications.md
  ui_url: ${NOTIFY_UI_URL:-}
  email: {host: "${SMTP_HOST:-}", username: "${SMTP_USER:-}", password: "${SMTP_PASSWORD:-}", sender: "${SMTP_FROM:-}", to: []}
  telegram: {bot_token: "${TELEGRAM_BOT_TOKEN:-}", chat_id: "${TELEGRAM_CHAT_ID:-}"}
  teams: {webhook_url: "${TEAMS_WEBHOOK_URL:-}"}
  slack: {webhook_url: "${SLACK_WEBHOOK_URL:-}"}
  discord: {webhook_url: "${DISCORD_WEBHOOK_URL:-}"}
  webhook: {url: "${WEBHOOK_URL:-}", token: "${WEBHOOK_TOKEN:-}"}
  ntfy: {topic: "${NTFY_TOPIC:-}", token: "${NTFY_TOKEN:-}"}

environments:
  - id: prod                    # lowercase, used in URLs
    name: Production Wazuh
    description: Wazuh 4.x cluster — 1 master, 2 workers, 3 indexer nodes
    language: null              # optional per-environment report language (en | tr | es | de)
    indexer:
      url: https://wazuh-indexer.example.internal:9200
      username: ${PROD_INDEXER_USER}
      password: ${PROD_INDEXER_PASSWORD}
      verify_tls: true
      # ca_file: /app/config/certs/root-ca.pem     # private CA (recommended over verify_tls: false)
      # client_cert: /app/config/certs/client.pem  # optional mutual TLS
      # client_key: /app/config/certs/client-key.pem
    api:                        # optional; without it agent/manager health and logtest are disabled
      url: https://wazuh-manager.example.internal:55000
      username: ${PROD_API_USER}
      password: ${PROD_API_PASSWORD}
      verify_tls: true
    alerts_index: wazuh-alerts-4.x-*
    vuln_index: wazuh-states-vulnerabilities-*
    storage_prefix: daily-triage        # results: daily-triage-runs / -knowledge in THIS indexer
    run_retention_days: 0               # >0: delete runs older than N days (knowledge is never pruned)
    schedule:
      enabled: true
      times: ["07:30", "19:30"]   # or a single `time: "07:30"`
      days: [mon, tue, wed, thu, fri]
    window_min_hours: 12        # window = since last successful run; 12h only when there is no report yet
    window_max_hours: 96        # cap, so Monday morning covers the weekend
    high_level: 7               # "high level" threshold
    max_silence_minutes: 60     # last alert older than this → "SIEM may be down"
    liveness: {enabled: true, interval_minutes: 10}   # quick check without AI; notifies problem + recovery
    disk_warn_percent: 75
    # required_daemons: [wazuh-analysisd, wazuh-remoted, wazuh-db, wazuh-modulesd, wazuh-apid]
    watch_rules: []             # rule IDs whose daily count is always reported
    watch_groups: [authentication_failed, web_scan, sshd]
    context_file: context/example.md    # free text describing the environment (given to the AI)
    seed_file: seed/example.yaml        # imported into the knowledge base once
    privacy:                    # GDPR / KVKK — docs/privacy.md
      mode: off                 # mask: pseudonymise personal data in everything sent to the LLM (and MCP clients)
      ips: keep                 # keep | public (pseudonymise public IPs only) | all
      detect: true              # flag personal data stored in clear text in the alerts (sampled every run)
      detect_sample: 1000
      allow: []                 # regexes never masked/reported, e.g. ['noreply@example\.com']
    rule_deploy:                # optional "Approve and deploy" for rule drafts — docs/rule-deployment.md
      enabled: false            # off: drafts show copy-paste commands only
      username: ${PROD_DEPLOY_USER:-}       # SEPARATE API user: update one rules file + restart, nothing else
      password: ${PROD_DEPLOY_PASSWORD:-}
      file: wdt_rules.xml       # etc/rules/<file> on the manager (master in a cluster)
      id_min: 100000            # drafts with IDs outside this range are refused
      id_max: 119999
    # mail: {alert_level: 7, max_per_hour: 12}   # your ossec.conf email_alert_level / email_maxperhour:
    #                                            # shows hours the mail channel was flooded + rules that may never have been mailed
    vuln_sla: {critical: 15, high: 30, medium: 90}   # days; overdue active vulnerabilities (needs vulnerability.detected_at)
    # inventory: [web01, db01]  # expected agent names (or inventory_file: one name per line) → missing / unexpected agents
    # promote:                  # "Make permanent": package to move a tested draft into your own configuration
    #   mode: host              # host: rules file on the manager | kubernetes: kustomize repo + kubectl apply -k
    #   rules_file: /var/ossec/etc/rules/local_rules.xml
    #   # kubernetes example (wazuh-kubernetes):
    #   # mode: kubernetes
    #   # repo_dir: /path/to/wazuh-kubernetes
    #   # rules_file: wazuh/wazuh_managers/wazuh_conf/local_rules.xml
    #   # kustomize_dir: wazuh
    #   # catalog_file: docs/alert-catalogue.md     # optional: a § draft is generated for it
    #   # kubeconfig: ~/.kube/config
    #   # namespace: wazuh
    #   # master_pod: wazuh-manager-master-0
    # sources:                  # extra read-only data for the AI — docs/sources.md
    #   prometheus: {url: "http://prometheus.monitoring:9090"}
    #   loki: {url: "http://loki-gateway.monitoring"}
    #   kubernetes: {enabled: true, namespaces: []}   # needs components/rbac-readonly
    # incident:                 # "Incident record draft" on findings
    #   id_prefix: "INC-"
    #   template_file: incident-template.md   # optional; {id} {title} {by} are filled in (or template: inline)
    #   zammad: {url: "https://zammad.example.com", token: "${ZAMMAD_TOKEN:-}", group: "SecOps", customer: "secops@example.com"}
    #   jira: {url: "https://wazuh.atlassian.net", email: "${JIRA_EMAIL:-}", token: "${JIRA_TOKEN:-}", project: "SEC", issue_type: "Incident"}
    # anomaly: true             # rule × agent spikes / new pairs vs. 14 days (no AI)
    # llm:                      # optional per-environment model, e.g. a local model for regulated data
    #   provider: openai
    #   base_url: http://ollama:11434/v1
    #   model: qwen3:14b

