# Used with WDT_DEMO=true: synthetic data, no real connections.
app:
  timezone: ${TZ:-UTC}
  language: ${APP_LANGUAGE:-en}
llm:
  provider: ${LLM_PROVIDER:-mock}
  model: ${LLM_MODEL:-}
  api_key: ${LLM_API_KEY:-}
  base_url: ${LLM_BASE_URL:-}
environments:
  - id: demo
    name: Demo Wazuh
    description: Demo environment with synthetic data
    indexer: {url: "https://demo:9200"}
    api: {url: "https://demo:55000"}
    watch_rules: ["100212", "100213"]
    watch_groups: [authentication_failed, web_scan, sshd]
    context_file: context/demo.md
    seed_file: seed/example.yaml
    schedule: {enabled: false}
    rule_deploy: {enabled: true}   # demo: deploys into the in-memory fake manager
    mail: {alert_level: 7, max_per_hour: 12}    # analyse e-mail channel saturation (ossec.conf email_maxperhour)
    vuln_sla: {critical: 15, high: 30, medium: 90}
    inventory: [web01, db01, jenkins, k8s-cp1, k8s-w1, k8s-w2, laptop-ops, mail01, backup01]
    promote: {mode: host, rules_file: /var/ossec/etc/rules/local_rules.xml}
