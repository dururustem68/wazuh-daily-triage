name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Do not paste real alert data, IP addresses, host names or credentials.** Security issues: use private vulnerability reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: { label: What happened, description: And what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: input
    id: version
    attributes: { label: wazuh-daily-triage version, placeholder: "0.1.0 / image tag" }
    validations: { required: true }
  - type: input
    id: wazuh
    attributes: { label: Wazuh version and deployment, placeholder: "4.14.x, Kubernetes / all-in-one / Docker" }
  - type: input
    id: llm
    attributes: { label: LLM provider and model, placeholder: "anthropic / openai (Ollama qwen3) ..." }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs (redacted), render: text }
