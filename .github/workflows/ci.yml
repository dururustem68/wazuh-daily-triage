name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - uses: pypa/gh-action-pip-audit@v1.1.1
        with:
          inputs: requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: wazuh-daily-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example overlay with every component
        working-directory: deploy/kubernetes/example
        run: |
          cp secret.env.example secret.env
          kubectl kustomize . > /dev/null
          for c in networkpolicy ingress-nginx ingress-traefik-authentik; do
            sed -i "s#^components: .*#components: [../components/$c]#" kustomization.yaml
            kubectl kustomize . > /dev/null && echo "$c OK"
          done
