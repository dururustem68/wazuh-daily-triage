name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - uses: pypa/gh-action-pip-audit@v1.1.1
        with:
          inputs: requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: wazuh-daily-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example overlay with every component
        working-directory: deploy/kubernetes/example
        run: |
          cp secret.env.example secret.env
          kubectl kustomize . > /dev/null
          for c in networkpolicy ingress-nginx ingress-traefik-authentik; do
            sed -i "s#^components: .*#components: [../components/$c]#" kustomization.yaml
            kubectl kustomize . > /dev/null && echo "$c OK"
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/wazuh-daily-triage
          helm template test deploy/helm/wazuh-daily-triage > /dev/null
          helm template test deploy/helm/wazuh-daily-triage \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true \
            --set secret.APP_PASSWORD=test > /dev/null

  chart-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: wdt
      - name: Install the chart on a real cluster
        run: |
          helm install wazuh-daily-triage ./deploy/helm/wazuh-daily-triage \
            --set secret.APP_PASSWORD=test --set secret.LLM_API_KEY=test \
            --set secret.INDEXER_PASSWORD=test --set secret.API_PASSWORD=test
          # /healthz answers without a reachable indexer, so the pod becomes Ready
          kubectl wait --for=condition=available --timeout=180s deployment/wazuh-daily-triage
          kubectl get pods
