name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: "mypy (gradual: web layer and small modules)"
        continue-on-error: true
        run: mypy
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Risk-based gate: a vulnerability in a runtime dependency fails the pipeline. Exceptions must be
      # listed in docs/security-exceptions.md and .github/pip-audit-ignore.txt, with an owner and an expiry.
      - name: pip-audit (fails on any known vulnerability)
        run: |
          pip install pip-audit
          ARGS=()
          while read -r id; do
            id="${id%%#*}"
            id="$(echo "$id" | tr -d '[:space:]')"
            if [ -n "$id" ]; then ARGS+=(--ignore-vuln "$id"); fi
          done < .github/pip-audit-ignore.txt
          pip-audit -r requirements.txt --desc ${ARGS[@]+"${ARGS[@]}"}
      - name: SBOM (CycloneDX, Python dependencies)
        run: |
          pip install cyclonedx-bom
          # cyclonedx-py >= 4 takes the requirements file positionally; there is no -r flag any more.
          cyclonedx-py requirements requirements.txt -o sbom-python.cdx.json --of JSON
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          retention-days: 90

  docker:
    runs-on: ubuntu-latest
    needs: [test, dependencies]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: wazuh-daily-triage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example overlay with every component
        working-directory: deploy/kubernetes/example
        run: |
          cp secret.env.example secret.env
          kubectl kustomize . > /dev/null
          for c in networkpolicy ingress-nginx ingress-traefik-authentik; do
            sed -i "s#^components: .*#components: [../components/$c]#" kustomization.yaml
            kubectl kustomize . > /dev/null && echo "$c OK"
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/wazuh-daily-triage
          helm template test deploy/helm/wazuh-daily-triage > /dev/null
          helm template test deploy/helm/wazuh-daily-triage \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true \
            --set secret.APP_PASSWORD=test > /dev/null

  chart-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: wdt
      - name: Install the chart on a real cluster
        run: |
          helm install wazuh-daily-triage ./deploy/helm/wazuh-daily-triage \
            --set secret.APP_PASSWORD=test --set secret.LLM_API_KEY=test \
            --set secret.INDEXER_PASSWORD=test --set secret.API_PASSWORD=test
          # /readyz needs no reachable indexer (readiness is startup-only by design), so the pod becomes Ready
          kubectl wait --for=condition=available --timeout=180s deployment/wazuh-daily-triage
          kubectl get pods
