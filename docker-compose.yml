services:
  triage:
    image: ghcr.io/dururustem68/wazuh-daily-triage:latest
    build: .
    container_name: wazuh-daily-triage
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"     # put a TLS reverse proxy in front to expose it
    volumes:
      - ./config:/app/config:ro   # environments.yaml, context/*.md, seed/*.yaml, certs/
      - ./logs:/app/logs          # audit trail (logs/audit.jsonl), ships with your own log collector
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Optional local model so no alert data leaves your network:
  #   docker compose --profile ollama up -d
  #   docker exec -it ollama ollama pull qwen3:14b
  # .env: LLM_PROVIDER=openai  LLM_BASE_URL=http://ollama:11434/v1  LLM_MODEL=qwen3:14b
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
