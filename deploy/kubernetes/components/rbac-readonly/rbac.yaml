# SPDX-License-Identifier: AGPL-3.0-only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-daily-triage
automountServiceAccountToken: false   # mounted only into the app pod (patched in the component)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wazuh-daily-triage-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, nodes, events, services, namespaces, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wazuh-daily-triage-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wazuh-daily-triage-readonly
subjects:
  - kind: ServiceAccount
    name: wazuh-daily-triage
    namespace: wazuh-daily-triage   # change if you deploy into another namespace
