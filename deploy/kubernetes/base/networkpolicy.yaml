# SPDX-License-Identifier: AGPL-3.0-only
# Optional: add "- ../base/networkpolicy.yaml" (or copy it) in your overlay and adjust.
# Ingress: only from the ingress controller namespace. Egress: DNS, your Wazuh, and HTTPS to the LLM.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-daily-triage
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx   # or traefik, kong...
      ports:
        - port: 8080
  egress:
    - ports:   # DNS
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:      # Wazuh indexer and API — replace with your addresses
        - ipBlock: { cidr: 192.0.2.10/32 }
      ports:
        - { port: 9200 }
        - { port: 55000 }
    - ports:   # hosted LLM (HTTPS)
        - { port: 443 }
